# ---------------------------------------------------------------------------
# 雑誌の追加方法
# ---------------------------------------------------------------------------
# title フィールドのみで検索できます。
# JAN コードが分かる場合は精度が上がります（各号ではなく定期刊行物の ISSN 相当）:
#
#   - title: "BRUTUS"
#     jan: "4910064690640"
#
# ISBN を使う場合:
#   - title: "Newton"
#     isbn: "9784315521481"
#
# 注意: JAN / ISBN どちらも指定がない場合はタイトル検索を行います。
#       タイトルは楽天ブックスでの正式表記に合わせてください。
